services:
  redis:
    image: redis:7.2-alpine
    container_name: ex-8-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6381:6379"
    volumes:
      - ./redis-data:/data
    restart: unless-stopped
    networks:
      - crawler-net

  app:
    build: .
    container_name: ex-8-web-crawler-app
    ports:
      - "8080:8080"
    environment:
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CRAWLER_DEFAULT_MAX_DEPTH: "3"
      CRAWLER_DEFAULT_MAX_PAGES: "50"
      CRAWLER_DEFAULT_WORKERS: "4"
      CRAWLER_POLITENESS_DELAY_MS: "50"
      CRAWLER_CACHE_TTL_MINUTES: "60"
    depends_on:
      - redis
    networks:
      - crawler-net

networks:
  crawler-net:
    driver: bridge
